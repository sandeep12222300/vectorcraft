spring:
  application:
    name: your-own-ai
  flyway:
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:55432}/yourownai}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  embedding-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
  generation-model: ${OLLAMA_GENERATION_MODEL:llama3.2}
  timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:120}

vectordb:
  hnsw:
    m: ${HNSW_M:16}
    ef-construction: ${HNSW_EF_CONSTRUCTION:100}
    ef-search: ${HNSW_EF_SEARCH:50}
  rag:
    chunk-size: ${RAG_CHUNK_SIZE:250}
    chunk-overlap: ${RAG_CHUNK_OVERLAP:30}
    default-k: ${RAG_DEFAULT_K:5}
    relevance-threshold: ${RAG_RELEVANCE_THRESHOLD:0.35}
    cache-ttl-seconds: ${RAG_CACHE_TTL_SECONDS:3600}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
